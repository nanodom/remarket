services:
  server:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Con el driver psycopg (v3) el esquema debe ser postgresql+psycopg://
      DATABASE_URL: postgresql+psycopg://remarket:remarket@db:5432/remarket
      SEED_DEMO: "0"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-password123}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: remarket
      POSTGRES_PASSWORD: remarket
      POSTGRES_DB: remarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_schema_remarket.sql:/docker-entrypoint-initdb.d/01_schema_remarket.sql:ro
      - ./db/02_seeders_remarket.sql:/docker-entrypoint-initdb.d/02_seeders.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remarket -d remarket"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: